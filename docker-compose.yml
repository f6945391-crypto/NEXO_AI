# Servicios de desarrollo. La aplicación corre fuera de Docker.
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: nexoai
      POSTGRES_PASSWORD: nexoai
      POSTGRES_DB: nexoai
    ports:
      - "5433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexoai"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  # T-122 · PT-3: buzón de desarrollo. Recibe todo lo que manda la plataforma, sin salir a internet.
  # SMTP en el 1025 (CORREO_SMTP_URL=smtp://localhost:1025) y los correos en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "1025:1025"
      - "8025:8025"

  # -------------------------------------------------------------------------------------------
  # Perfil «aplicacion»: la API, el trabajador y la web en contenedores (README.md, «Ejecutar con
  # contenedores»). Solo se levantan con: docker compose --profile aplicacion up --build
  # Sin el perfil, docker compose up -d sigue levantando solo PostgreSQL y Redis.
  #
  # Las variables salen de .env (env_file). Dentro de la red de compose la base es postgres:5432 y
  # Redis es redis:6379, no localhost: environment sobreescribe esas dos, y se pueden cambiar con
  # DATABASE_URL_CONTENEDOR y REDIS_URL_CONTENEDOR en .env sin tocar las de desarrollo.

  migrar:
    profiles: ["aplicacion"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migraciones
    image: nexoai-migrar:local
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL_CONTENEDOR:-postgresql://nexoai:nexoai@postgres:5432/nexoai}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["aplicacion"]
    build: &imagen-api
      context: .
      dockerfile: apps/api/Dockerfile
      target: final
    image: nexoai-api:local
    env_file: .env
    environment: &entorno-api
      PUERTO: "3000"
      DATABASE_URL: ${DATABASE_URL_CONTENEDOR:-postgresql://nexoai:nexoai@postgres:5432/nexoai}
      REDIS_URL: ${REDIS_URL_CONTENEDOR:-redis://redis:6379}
    ports:
      - "3000:3000"
    depends_on: &dependencias-api
      migrar:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      # Redis no tiene comprobación de salud en el servicio de desarrollo y se deja como está;
      # ioredis reintenta la conexión si tarda en aceptar.
      redis:
        condition: service_started

  # Misma imagen que la API, con otro comando (AD-01). Sin «build» propio: si los dos servicios la
  # construyen, compose lanza dos construcciones a la vez con la misma etiqueta y la segunda falla con
  # «image nexoai-api:local already exists» (T-140). La construye «api»; aquí solo se usa, sin bajarla.
  trabajador:
    profiles: ["aplicacion"]
    image: nexoai-api:local
    pull_policy: never
    command: ["node", "dist/trabajador.js"]
    env_file: .env
    environment: *entorno-api
    depends_on: *dependencias-api
    # El trabajador no abre puerto: la comprobación de la imagen (GET /salud) no aplica.
    healthcheck:
      disable: true

  web:
    profiles: ["aplicacion"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: nexoai-web:local
    env_file: .env
    environment:
      PORT: "3001"
      # El servidor de la web habla con la API por la red de compose. El navegador nunca llama a la API
      # directamente (src/lib/sesion.ts).
      API_URL: ${API_URL_CONTENEDOR:-http://api:3000}
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres:
