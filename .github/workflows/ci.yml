name: verificar

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: nexoai
          POSTGRES_PASSWORD: nexoai
          POSTGRES_DB: nexoai_prueba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexoai"
          --health-interval 5s
          --health-retries 10
      # Cola de BullMQ (T-014)
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://nexoai:nexoai@localhost:5432/nexoai_prueba
      DATABASE_URL_PRUEBA: postgresql://nexoai:nexoai@localhost:5432/nexoai_prueba
      JWT_SECRETO: solo-para-la-integracion-continua
      TOKENS_CLAVE_CIFRADO: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm --filter @nexoai/web exec playwright install chromium
      - run: pnpm verificar
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"

  # Construye las imágenes de apps/api/Dockerfile y apps/web/Dockerfile sin publicarlas: comprueba que
  # siguen construyendo. Corre en paralelo a verificar y no lo bloquea. Sin registros ni secretos.
  imagenes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Imagen de la API y del trabajador
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: final
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Imagen de las migraciones
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migraciones
          push: false
          cache-from: type=gha,scope=api
      - name: Imagen de la web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
