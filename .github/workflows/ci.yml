name: verificar

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: nexoai
          POSTGRES_PASSWORD: nexoai
          POSTGRES_DB: nexoai_prueba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexoai"
          --health-interval 5s
          --health-retries 10
      # Cola de BullMQ (T-014)
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://nexoai:nexoai@localhost:5432/nexoai_prueba
      DATABASE_URL_PRUEBA: postgresql://nexoai:nexoai@localhost:5432/nexoai_prueba
      JWT_SECRETO: solo-para-la-integracion-continua
      TOKENS_CLAVE_CIFRADO: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - run: pnpm --filter @nexoai/web exec playwright install chromium
      - run: pnpm verificar
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: "1"
